<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FBC Code Reviewer · Meridian</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Light and dark both follow the OS. There is no theme toggle to build, get wrong,
         or persist. -->
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Deterministic Florida Building Code plan review for vector permit sets."
    />

    <!-- The Meridian text faces. These live here rather than as the @import inside
         styles/meridian/tokens/fonts.css because a CSS @import is only valid before every
         other rule, and the build concatenates that file into one bundle ahead of the
         application layer. Same families, same weights, ordered correctly, and it starts
         earlier than a stylesheet-nested import would. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
    />

    <!-- Drafting notation, not an icon: three rules and an engineer-red cross tick, in
         the system's own ink, paper and red. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2316191C'/%3E%3Cpath d='M6 8h20M6 15h14M6 22h10' stroke='%23EEF1F5' stroke-width='1.6'/%3E%3Cpath d='M19 22.5h9M23.5 18v9' stroke='%23D24A3C' stroke-width='1.6'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
