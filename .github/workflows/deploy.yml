name: CI and deploy

# Tests gate everything. A push to main that passes them builds the API image,
# deploys it to Cloud Run by commit SHA, and deploys Hosting when the client or
# the Hosting config changed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Never a downloaded service-account key. Workload Identity Federation needs an
# OIDC token, which is what id-token: write grants.
permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-east1
  SERVICE: fbc-review
  REPOSITORY: fbc
  # Must match the container: the engine is verified against 3.12, not the 3.14
  # a developer may have locally.
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24.19.0'

jobs:
  # ── version ────────────────────────────────────────────────────────────
  # What this build is called.
  #
  # `VERSION` at the repository root holds the release triple and the channel
  # and nothing else — `1.0.0-alpha`. The build number is stamped on here, from
  # `github.run_number`, because a number that has to be edited by hand is a
  # number that stops being edited. run_number increments once per run of this
  # workflow, never resets on a re-run of the same one (that is run_attempt),
  # and needs neither a commit back to the repository nor `contents: write`.
  #
  #     ALPHA   1.0.0-alpha.<run>+<sha>
  #     BETA    1.0.0-beta.<run>+<sha>
  #     PROD    1.0.0+build.<run>.<sha>
  #
  # SemVer 2.0.0 precedence, unmodified: `1.0.0-alpha.9 < 1.0.0-alpha.10 <
  # 1.0.0-beta.1 < 1.0.0`. Numeric pre-release identifiers compare numerically,
  # so build 10 outranks build 9 — which a string comparison gets backwards.
  # A production release has no pre-release part to extend and a fourth number
  # would not be SemVer, so its build number goes into the metadata.
  #
  # Promoting alpha to beta, or beta to production, is one edit to `VERSION`.
  # webapp/version.py applies the same rule in Python and is what the service
  # and the local scripts use; tests/test_version.py holds the two together.
  #
  # This runs on pull requests too. It is seconds of work and it means a typo in
  # `VERSION` fails on the branch rather than on main.
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      release: ${{ steps.stamp.outputs.release }}
      channel: ${{ steps.stamp.outputs.channel }}
      image_tag: ${{ steps.stamp.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - id: stamp
        env:
          BUILD: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="$(grep -vE '^[[:space:]]*(#|$)' VERSION | head -1 | tr -d '[:space:]')"

          if ! printf '%s' "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta))?$'; then
            echo "::error file=VERSION::VERSION must be MAJOR.MINOR.PATCH with an optional -alpha or -beta channel. Got '${base}'."
            exit 1
          fi

          release="${base%%-*}"
          channel="${base#"$release"}"
          channel="${channel#-}"
          channel="${channel:-prod}"
          short="${SHA:0:7}"

          if [ "$channel" = prod ]; then
            version="${release}+build.${BUILD}.${short}"
          else
            version="${base}.${BUILD}+${short}"
          fi

          # A Docker tag may not contain '+'. Same build, spellable name.
          image_tag="${version//+/_}"

          {
            echo "version=${version}"
            echo "release=${release}"
            echo "channel=${channel}"
            echo "image_tag=${image_tag}"
          } >> "$GITHUB_OUTPUT"

          echo "### \`${version}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "channel \`${channel}\` · build \`${BUILD}\` · commit \`${short}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Build ${version} (${channel})."

  # ── the engine and the service ─────────────────────────────────────────
  python-tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Rebuilding scanned sheets needs Tesseract. Without it the OCR test skips
      # rather than fails, and the coverage silently disappears — so install it.
      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          echo "TESSDATA_PREFIX=$(dirname "$(find /usr/share -name eng.traineddata -print -quit)")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the regression gate and the service tests
        run: python -m pytest tests/ -v

  # ── the client ─────────────────────────────────────────────────────────
  web-tests:
    name: ng build and ng test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # strictTemplates is on, so a template type error fails here.
      - run: npm run build
        working-directory: web

      - run: npm run test:ci
        working-directory: web

  # ── the contract ───────────────────────────────────────────────────────
  client-drift:
    name: generated client matches the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: web

      # This is what keeps the contract honest. Regenerate from the app's own
      # schema and fail if anything differs from what is committed: a backend
      # field rename that was not carried into the client is a red build here
      # rather than a runtime `undefined` in front of a user.
      - name: Regenerate the schema and the client
        run: npm run api:refresh
        working-directory: web

      - name: Fail if the committed output is stale
        run: |
          if ! git diff --quiet -- openapi.json web/src/app/api; then
            echo "::error::openapi.json or web/src/app/api is out of date."
            echo "Run 'npm run api:refresh' in web/ and commit the result."
            git diff --stat -- openapi.json web/src/app/api
            git diff -- openapi.json web/src/app/api | head -200
            exit 1
          fi
          echo "Generated client matches the API."

  # ── deploy ─────────────────────────────────────────────────────────────
  # Is there a deployment to deploy to?
  #
  # Every value the deploy jobs need is a repository variable (§5 of the
  # runbook), and until they are set `google-github-actions/auth` fails with
  # "must specify exactly one of workload_identity_provider or
  # credentials_json" — which reads like a broken workflow and is not one.
  # That failure has been red on every push to main since the workflow was
  # written, while pytest, ng build/test and the drift check all passed, so
  # red on main stopped meaning anything and a genuine break would not have
  # been noticed.
  #
  # So the deploy is skipped, loudly, until it is configured. This job reads
  # the variables in a *step* rather than in a job-level `if:`, because a step
  # can read them without question and the deploy jobs then gate on a `needs`
  # output — which is unambiguously available in `if:`.
  deploy-gate:
    name: deployment configured?
    needs: [python-tests, web-tests, client-drift]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
          FBC_BUCKET: ${{ vars.FBC_BUCKET }}
          FBC_ALLOWED_EMAILS: ${{ vars.FBC_ALLOWED_EMAILS }}
        run: |
          missing=()
          # All five are required, and the runbook says why: the first three
          # are what authenticates and names the project, FBC_BUCKET is
          # required by webapp/config.py, and an empty FBC_ALLOWED_EMAILS
          # means nobody gets in. Deploying without any of them puts up a
          # service that cannot work.
          for v in GCP_PROJECT_ID WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT \
                   FBC_BUCKET FBC_ALLOWED_EMAILS; do
            [ -n "${!v}" ] || missing+=("$v")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploying to ${GCP_PROJECT_ID}."
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployment is not configured, so Cloud Run and Hosting are skipped. The tests still gate every push. Set these repository variables to enable it (docs/DEPLOYMENT.md section 5): ${missing[*]}."

  deploy-api:
    name: Cloud Run
    needs: [python-tests, web-tests, client-drift, deploy-gate, version]
    # A skipped gate produces no output, so this is false on a pull request as
    # well — the branch and event check is kept because it states the intent.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push'
      && needs.deploy-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Authorise Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # linux/amd64 explicitly: Cloud Run runs amd64, and a silently-arm64 image
      # fails at start rather than at build.
      #
      # Two tags, one image. The SHA tag is what the revision is deployed from,
      # because it is the one that cannot be moved or reused. The version tag is
      # for a human reading `gcloud artifacts docker images list` and wanting to
      # know which build was 1.0.0-alpha.412 without resolving a SHA first.
      - name: Build and push
        run: |
          REPO_PATH="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"
          IMAGE="${REPO_PATH}:${GITHUB_SHA}"
          docker buildx build --platform linux/amd64 \
            -t "$IMAGE" \
            -t "${REPO_PATH}:${IMAGE_TAG}" \
            --push .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
        env:
          IMAGE_TAG: ${{ needs.version.outputs.image_tag }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --memory=2Gi
            --cpu=2
            --concurrency=4
            --timeout=900
            --min-instances=0
            --max-instances=5
            --service-account=fbc-review-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          # FBC_VERSION is what the revision reports on /healthz and what the
          # client prints in the masthead and the footer. Handed in rather than
          # recomputed in the container: the image has no .git and no build
          # number, so this is the only place the full string exists.
          env_vars: |
            FBC_BUCKET=${{ vars.FBC_BUCKET }}
            FBC_PROJECT_ID=${{ env.PROJECT_ID }}
            FBC_ALLOWED_EMAILS=${{ vars.FBC_ALLOWED_EMAILS }}
            FBC_SIGNER_SA=fbc-review-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            FBC_VERSION=${{ needs.version.outputs.version }}

      # Checks *which* build answered, not just that one did. Traffic can still
      # be on the previous revision when a deploy has not fully rolled over, and
      # a 200 from the old one would otherwise read as a successful deploy.
      - name: Smoke-test the new revision
        env:
          EXPECTED: ${{ needs.version.outputs.version }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            body=$(curl -s --max-time 10 "${URL}/healthz" || true)
            reported=$(printf '%s' "$body" | python3 -c \
              'import json,sys; print((json.load(sys.stdin) or {}).get("version",""))' 2>/dev/null || true)
            if [ "$reported" = "$EXPECTED" ]; then
              echo "healthz OK — serving ${reported}"
              echo "Deployed \`${EXPECTED}\` to ${URL}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::/healthz never reported ${EXPECTED}. Last answer: ${reported:-<none>}"
          exit 1

  # ── hosting ────────────────────────────────────────────────────────────
  changes:
    name: what changed
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
             | grep -Eq '^(web/|firebase\.json|firestore\.)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-hosting:
    name: Firebase Hosting
    needs: [deploy-api, changes, deploy-gate, version]
    # Stated rather than inherited from deploy-api being skipped, so this does
    # not depend on how a skipped `needs` propagates.
    if: >-
      needs.changes.outputs.web == 'true'
      && needs.deploy-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}

      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      # The CLI picks up Application Default Credentials from the auth step, so
      # no FIREBASE_TOKEN and no key file.
      #
      # No version is injected into the bundle: the client reads it from
      # /api/healthz, which Hosting rewrites to the revision deploy-api just put
      # up. One number, from the service that is actually answering, rather than
      # a second one baked into a CDN artefact that can outlive it.
      - name: Deploy Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project "${PROJECT_ID}" --non-interactive
